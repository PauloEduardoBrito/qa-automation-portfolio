<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - QA Automation Portfolio</title>
</head>
<body>
  <main>
    <h1>Dashboard</h1>
    <p id="welcomeMessage">Carregando usuário...</p>
    <button type="button" id="logoutButton">Sair</button>
    <p id="message" role="status"></p>
  </main>

  <script>
    async function loadUser() {
      const welcomeMessage = document.getElementById('welcomeMessage')

      try {
        const response = await fetch('/api/me')
        const data = await response.json()

        if (!response.ok || !data.authenticated) {
          window.location.href = '/'
          return
        }

        welcomeMessage.textContent =
          `Bem-vindo, ${data.user.username}!`
      } catch (error) {
        welcomeMessage.textContent =
          'Erro ao carregar os dados do usuário.'
      }
    }

    document.getElementById('logoutButton').addEventListener('click', async () => {
      const message = document.getElementById('message')

      try {
        const response = await fetch('/api/logout', {
          method: 'POST'
        })

        if (response.ok) {
          window.location.href = '/'
          return
        }

        message.textContent = 'Não foi possível encerrar a sessão.'
      } catch (error) {
        message.textContent = 'Erro ao conectar com o servidor.'
      }
    })

    loadUser()
  </script>
</body>
</html>
